name: Temporary Encrypted Arc Reader Transfer
on:
  push:
    branches: [arc-reader-transfer-2211]
    paths: [.github/workflows/arc-transfer.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download RSA-encrypted Arc Reader intermediate (not an installable APK)
        env:
          ENCRYPTED_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1415126867/312de674-5243-4955-9e66-3a025a6e7176?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-11-23T03%3A44%3A09Z&rscd=attachment%3B+filename%3Darc-reader-encrypted.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-11-23T02%3A43%3A33Z&ske=2026-11-23T03%3A44%3A09Z&sks=b&skv=2018-11-09&sig=AbLikHcAtFlgHU66qe0M9nc%2BjTZo%2FWYaNqxC7b8XsWY%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5NTQwMzk2MSwibmJmIjoxNzk1NDAyMTYxLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.X8Pw3-vtTJBR1njRRjeN4ptMnW2lasADClhh171iuG0&response-content-disposition=attachment%3B%20filename%3Darc-reader-encrypted.zip&response-content-type=application%2Foctet-stream"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --max-time 300 "$ENCRYPTED_URL" -o /tmp/arc-reader-encrypted.zip
          test "$(stat -c %s /tmp/arc-reader-encrypted.zip)" -gt 40000000
          unzip -t /tmp/arc-reader-encrypted.zip
      - uses: actions/upload-artifact@v4
        with:
          name: arc-reader-v2212-rsa-encrypted
          path: /tmp/arc-reader-encrypted.zip
          retention-days: 1
          if-no-files-found: error
